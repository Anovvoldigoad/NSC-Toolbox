name: Build Native NSC Switch Android Preview APK
on:
  pull_request:
    paths:
      - 'switch-android/**'
      - '.github/workflows/build-switch-android-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: switch-android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Validate generated APK
        run: |
          set -euo pipefail
          apk=switch-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" | tail -1
          sha256sum "$apk" > switch-android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NSC-Switch-Android-v05-Preview-APK
          path: |
            switch-android/app/build/outputs/apk/debug/app-debug.apk
            switch-android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14
