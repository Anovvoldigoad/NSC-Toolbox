name: Auto-audit latest ModdingAPI with REA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install REA and RAR extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          npm install -g rea-agents
      - name: Fetch official latest release; no user-supplied DLL needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/report
          VERSION=$(gh api repos/TheLeonX/NSC-ModManager/releases/latest --jq .tag_name)
          gh release download "$VERSION" -R TheLeonX/NSC-ModManager -p 'NSC-ModManager.rar' -D audit/input
          7z x -y -bd audit/input/NSC-ModManager.rar -oaudit/input/unpacked >/dev/null
          printf 'Release: %s\n' "$VERSION" >audit/report/metadata.txt
      - name: Inspect shipped binaries with REA
        run: |
          set -euo pipefail
          while IFS= read -r -d '' candidate; do
            label=$(echo "$candidate" | sha256sum | cut -c1-12)
            sha256sum "$candidate" >>audit/report/sha256.txt
            rea inspect-pe-imports "$candidate" --json > "audit/report/${label}_imports.json" 2>&1 || true
            rea inspect-native-exports "$candidate" --json > "audit/report/${label}_exports.json" 2>&1 || true
            if [[ "$candidate" == *ModManager.exe ]]; then
              rea inspect-managed-artifact "$candidate" --json > "audit/report/${label}_managed.json" 2>&1 || true
              rea inspect-managed-members "$candidate" --detail summary --evidence-bundle "$PWD/audit/report/${label}_members.json" --json > "audit/report/${label}_member_index.json" 2>&1 || true
            fi
          done < <(find audit/input/unpacked -type f \( -iname 'd3dcompiler_47.dll' -o -iname 'CPKLoader.dll' -o -iname 'EncryptCPK.dll' -o -iname '*ModManager.exe' \) -print0 | head -z -n 20)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REA-upstream-binary-audit
          path: audit/report/
          retention-days: 14
