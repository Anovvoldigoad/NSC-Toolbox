name: Ghidra x64 loader decompilation (research only)
on:
  pull_request:
    paths:
      - .github/workflows/ghidra-native-audit.yml
      - tools/ghidra/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install unpacker and download verified official Ghidra
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          mkdir -p analysis/ghidra analysis/input analysis/reports
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 800 \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip \
            -o analysis/ghidra.zip
          echo '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  analysis/ghidra.zip' | sha256sum -c -
          7z x -y -bd analysis/ghidra.zip -oanalysis/ghidra > /dev/null
      - name: Fetch latest official manager DLLs without needing user uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(gh api repos/TheLeonX/NSC-ModManager/releases/latest --jq .tag_name)"
          gh release download "$version" -R TheLeonX/NSC-ModManager \
            -p 'NSC-ModManager.rar' -D analysis/input
          7z x -y -bd analysis/input/NSC-ModManager.rar -oanalysis/input/upstream > /dev/null
          printf 'source_release=%s\n' "$version" > analysis/reports/source.txt
          find analysis/input/upstream -type f \( -iname CPKLoader.dll -o -iname EncryptCPK.dll \) -print \
            | sort > analysis/reports/loader_file_list.txt
          test "$(wc -l < analysis/reports/loader_file_list.txt)" -ge 2
      - name: Decompile selected original x64 exports for port specification
        run: |
          set -euo pipefail
          headless=$(find analysis/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)
          test -n "$headless"
          mkdir -p analysis/projects
          for name in CPKLoader EncryptCPK; do
            path=$(find analysis/input/upstream -name "$name.dll" -type f -print -quit)
            test -n "$path"
            sha256sum "$path" >> analysis/reports/source-hashes.txt
            "$headless" "$PWD/analysis/projects" "$name" \
              -import "$PWD/$path" \
              -scriptPath "$PWD/tools/ghidra" \
              -postScript ExportHooks.java "$PWD/analysis/reports/$name.c" \
              -analysisTimeoutPerFile 600 \
              -max-cpu 2 \
              -deleteProject \
              > "analysis/reports/$name.ghidra.log" 2>&1
            grep -q 'selected_functions=' "analysis/reports/$name.c"
            if grep -q 'selected_functions=0' "analysis/reports/$name.c"; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ghidra-current-runtime-loader-research
          path: analysis/reports/
          retention-days: 7
          if-no-files-found: warn
