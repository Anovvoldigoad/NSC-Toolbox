<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<style>
html,body{width:100%;height:100%;margin:0;background:#101722;color:#e8f0f8;font:13px system-ui}
*{box-sizing:border-box}
#viewport{width:100%;height:calc(100% - 86px);display:block;touch-action:none}
#bar{height:86px;padding:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
button,select{background:#284762;color:#fff;border:1px solid #4b6c88;padding:6px;border-radius:5px}
#status{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<canvas id="viewport"></canvas>
<div id="bar">
<button id="play" disabled>Play / Pause</button>
<select id="clips" aria-label="Animation clip"><option>No animations</option></select>
<button id="reset">Reset camera</button>
<div id="status">Loading Babylon.js...</div>
</div>
<script>
(function(){
 const status=document.getElementById('status');
 const canvas=document.getElementById('viewport');
 const clips=document.getElementById('clips');
 const play=document.getElementById('play');
 let scene,engine,camera,activeGroup=null;
 window.viewerReady=false;
 const say=(message)=>{status.textContent=String(message)};
 if(typeof BABYLON==='undefined'){
   say('Rendering library failed to load. Check internet.');
   return;
 }
 try{
   engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false});
   scene=new BABYLON.Scene(engine);
   scene.clearColor=new BABYLON.Color4(.063,.09,.135,1);
   camera=new BABYLON.ArcRotateCamera('orbit',-Math.PI/2,Math.PI/2.7,5,
       new BABYLON.Vector3(0,1,0),scene);
   camera.attachControl(canvas,true);
   camera.lowerRadiusLimit=.2;
   camera.upperRadiusLimit=1000;
   new BABYLON.HemisphericLight('ambient',new BABYLON.Vector3(0,1,1),scene);
   new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-1,-2,1),scene);
   engine.runRenderLoop(()=>scene.render());
   window.addEventListener('resize',()=>engine.resize());
   window.viewerReady=true;
   say('Ready: select a self-contained .glb file.');
 }catch(e){say('WebGL error: '+e.message);return}
 document.getElementById('reset').onclick=()=>{
   camera.alpha=-Math.PI/2;camera.beta=Math.PI/2.7;camera.radius=5;
   camera.setTarget(new BABYLON.Vector3(0,1,0));
 };
 play.onclick=()=>{
   if(!activeGroup)return;
   if(activeGroup.isPlaying)activeGroup.pause();
   else activeGroup.play(true);
 };
 clips.onchange=()=>{
   if(activeGroup)activeGroup.stop();
   activeGroup=scene.animationGroups[Number(clips.value)]||null;
   if(activeGroup)activeGroup.start(true);
 };
 window.loadModelFromBase64=async function(base64){
   try{
     say('Reading GLB...');
     const binary=atob(base64);
     const bytes=new Uint8Array(binary.length);
     for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
     if(bytes.length<12||bytes[0]!==0x67||bytes[1]!==0x6c||
         bytes[2]!==0x54||bytes[3]!==0x46)
       throw Error('Not a valid binary glTF (GLB) file');
     for(const group of scene.animationGroups.slice())group.dispose();
     for(const mesh of scene.meshes.slice())mesh.dispose();
     for(const mat of scene.materials.slice())mat.dispose();
     for(const skeleton of scene.skeletons.slice())skeleton.dispose();
     say('Loading mesh and animation data...');
     const file=new File([bytes],'preview.glb',{type:'model/gltf-binary'});
     const result=await BABYLON.SceneLoader.ImportMeshAsync(null,'',file,scene,undefined,'.glb');
     if(!result.meshes.length)throw Error('File has no meshes');
     const rendered=scene.meshes.filter(m=>m.getTotalVertices&&m.getTotalVertices()>0);
     if(rendered.length){
       let min=new BABYLON.Vector3(Infinity,Infinity,Infinity);
       let max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);
       for(const mesh of rendered){
         mesh.computeWorldMatrix(true);
         const box=mesh.getBoundingInfo().boundingBox;
         min=BABYLON.Vector3.Minimize(min,box.minimumWorld);
         max=BABYLON.Vector3.Maximize(max,box.maximumWorld);
       }
       camera.setTarget(min.add(max).scale(.5));
       camera.radius=Math.max(1,BABYLON.Vector3.Distance(min,max)*1.5);
     }
     clips.replaceChildren();
     scene.animationGroups.forEach((group,i)=>{
       const option=document.createElement('option');
       option.value=String(i);
       option.textContent=group.name||'Animation '+(i+1);
       clips.appendChild(option);
     });
     if(!scene.animationGroups.length){
       const option=document.createElement('option');
       option.textContent='No animation clips';clips.appendChild(option);
     }
     play.disabled=!scene.animationGroups.length;
     activeGroup=scene.animationGroups[0]||null;
     if(activeGroup)activeGroup.start(true);
     say('Meshes: '+rendered.length+' | Clips: '+scene.animationGroups.length+
         ' | Skeletons: '+scene.skeletons.length);
   }catch(error){say('GLB error: '+(error.message||error))}
 };
})();
</script>
</body>
</html>
